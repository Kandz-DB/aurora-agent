services:
  - type: web
    name: aurora-r2s
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONTHLY_SPEND_CAP_USD
        value: "20"
      - key: SPEND_ALERT_THRESHOLD
        value: "0.8"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MONDAY_API_KEY
        sync: false
      - key: MONDAY_BOARD_ID
        sync: false
      - key: OUTLOOK_SHARED_MAILBOX
        value: info@risk2solution.com
      - key: FRONTEND_URL
        sync: false
